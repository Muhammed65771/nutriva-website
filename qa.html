<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>Website QA | Nutriva AI</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
  <link rel="stylesheet" href="/site.css?v=4" />
  <style>
    .qa { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
    .qa h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.03em; }
    .qa h2 { font-size: 20px; font-weight: 750; margin: 0 0 12px; }
    .qa section { padding: 24px; margin-top: 16px; }
    .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
    .row:first-of-type { border-top: 0; }
    .badge { flex: none; min-width: 64px; text-align: center; font: 700 12px/1 var(--font); padding: 6px 8px; border-radius: 999px; background: #EEF2F7; color: var(--text-2); }
    .badge.pass { background: #DCFCE7; color: #166534; }
    .badge.fail { background: #FEE2E2; color: #991B1B; }
    .row .what { flex: 1; }
    .row .detail { font-size: 13px; color: var(--text-2); }
    .row label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; flex: 1; }
    .row input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
    .summary { margin-top: 12px; color: var(--text-on-bg); }
  </style>
</head>
<body>
<main class="qa" id="main">
  <p class="eyebrow">Internal</p>
  <h1>Website QA</h1>
  <p class="lead">Checks for the Nutriva AI 2.0 website. This page is not indexed. Checkbox state is saved in this browser only.</p>
  <p><button class="btn btn-primary" id="run" type="button">Run automatic checks</button></p>
  <p class="summary" id="summary" aria-live="polite"></p>

  <section class="glass" aria-labelledby="auto-title">
    <h2 id="auto-title">Automatic checks</h2>
    <div id="auto"></div>
  </section>

  <section class="glass" aria-labelledby="manual-title">
    <h2 id="manual-title">Manual checks</h2>
    <div id="manual"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var PAGES = ['/', '/support', '/privacy', '/terms'];
  var DISCLAIMER = 'is not a medical device';
  var TRADEMARK = 'trademarks of Apple Inc.';

  var auto = [
    { id: 'assets', name: 'Assets load: site.css, app-icon.png, favicon.png, apple-touch-icon.png',
      run: function () { return Promise.all(['/site.css', '/app-icon.png', '/favicon.png', '/apple-touch-icon.png'].map(function (u) {
        return fetch(u, { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(u + ' HTTP ' + r.status); });
      })); } },
    { id: 'pages', name: 'Home, Support, Privacy and Terms load',
      run: function () { return Promise.all(PAGES.map(get)); } },
    { id: 'footer', name: 'Every page shows the medical disclaimer and the Apple trademark line',
      run: function () { return Promise.all(PAGES.map(function (u) { return get(u).then(function (t) {
        if (t.indexOf(DISCLAIMER) < 0) throw new Error(u + ': medical disclaimer missing');
        if (t.indexOf(TRADEMARK) < 0) throw new Error(u + ': trademark line missing');
      }); })); } },
    { id: 'no-recipes', name: 'No page mentions recipes',
      run: function () { return Promise.all(PAGES.map(function (u) { return get(u).then(function (t) {
        if (/recipe/i.test(t)) throw new Error(u + ' mentions recipes');
      }); })); } },
    { id: 'pricing', name: 'Home has pricing, subscription terms and links to Terms and Privacy',
      run: function () { return get('/').then(function (t) {
        ['id="pricing"', 'Nutriva Pro', 'at least 24 hours', 'href="/terms"', 'href="/privacy"', '200 Coach chats'].forEach(function (k) {
          if (t.indexOf(k) < 0) throw new Error('missing: ' + k);
        });
      }); } },
    { id: 'privacy', name: 'Privacy names OpenAI and Google Gemini, Coach storage, device identifier and deletion',
      run: function () { return get('/privacy').then(function (t) {
        ['OpenAI', 'Gemini', 'identifier for vendor', 'deleted when you delete your account', 'Delete account', 'does not use cookies'].forEach(function (k) {
          if (t.indexOf(k) < 0) throw new Error('missing: ' + k);
        });
      }); } },
    { id: 'terms', name: 'Terms keep the medical disclaimer and include subscription terms and fair use',
      run: function () { return get('/terms').then(function (t) {
        ['MEDICAL DISCLAIMER', 'Nutriva Pro', '13 October 2026', '200 AI Coach chats', '24 hours'].forEach(function (k) {
          if (t.indexOf(k) < 0) throw new Error('missing: ' + k);
        });
      }); } },
    { id: 'support', name: 'Support has contact email and delete-account steps',
      run: function () { return get('/support').then(function (t) {
        ['id="delete-account"', 'mailto:nutrivaaiteam@gmail.com', 'Delete Permanently'].forEach(function (k) {
          if (t.indexOf(k) < 0) throw new Error('missing: ' + k);
        });
      }); } }
  ];

  var manual = [
    'Light theme only on every page, also when the device is in dark mode',
    'At 375 px wide: no sideways scrolling on Home, Support, Privacy, Terms',
    'Mobile Menu opens and every link works',
    'App Store badges open the Nutriva AI App Store page',
    'Nav links: Features and Pricing scroll on Home; Support, Privacy, Terms open their pages',
    'FAQ items open and close with mouse and keyboard (Tab, Enter)',
    'Visible focus ring on every link and button when using the keyboard',
    'With Reduce Motion on: no drifting background, no rise-in animation',
    'Cards are readable (contrast) and glass looks right in Safari and Chrome',
    'support#delete-account link from the footer jumps to the delete steps',
    'Auth pages still work: /reset-password, /confirm, /auth-confirm (open from a real email)',
    'Old URLs still work: /privacy, /terms, /support (the app and App Store Connect link to them)'
  ];

  function get(u) {
    return fetch(u, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(u + ' HTTP ' + r.status);
      return r.text();
    });
  }

  var autoEl = document.getElementById('auto');
  auto.forEach(function (t) {
    var row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<span class="badge" id="b-' + t.id + '">not run</span><div class="what"><div></div><div class="detail" id="d-' + t.id + '"></div></div>';
    row.querySelector('.what > div').textContent = t.name;
    autoEl.appendChild(row);
  });

  var manualEl = document.getElementById('manual');
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('nutriva-qa-v2') || '{}'); } catch (e) { saved = {}; }
  manual.forEach(function (text, i) {
    var row = document.createElement('div'); row.className = 'row';
    var id = 'm' + i;
    row.innerHTML = '<label for="' + id + '"><input type="checkbox" id="' + id + '"><span></span></label>';
    row.querySelector('span').textContent = text;
    var box = row.querySelector('input');
    box.checked = !!saved[id];
    box.addEventListener('change', function () {
      saved[id] = box.checked;
      try { localStorage.setItem('nutriva-qa-v2', JSON.stringify(saved)); } catch (e) {}
    });
    manualEl.appendChild(row);
  });

  document.getElementById('run').addEventListener('click', function () {
    var pass = 0, fail = 0;
    var jobs = auto.map(function (t) {
      var b = document.getElementById('b-' + t.id), d = document.getElementById('d-' + t.id);
      b.textContent = 'running'; b.className = 'badge'; d.textContent = '';
      return Promise.resolve().then(t.run).then(function () {
        pass++; b.textContent = 'pass'; b.className = 'badge pass';
      }, function (e) {
        fail++; b.textContent = 'fail'; b.className = 'badge fail'; d.textContent = e.message;
      });
    });
    Promise.all(jobs).then(function () {
      document.getElementById('summary').textContent = pass + ' passed, ' + fail + ' failed · ' + new Date().toLocaleTimeString();
    });
  });
})();
</script>
</body>
</html>
